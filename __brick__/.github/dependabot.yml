version: 2

updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      firebase:
        patterns: ["firebase_*", "cloud_firestore"]
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /rules_test
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
