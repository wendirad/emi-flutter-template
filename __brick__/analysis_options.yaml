include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Imports: relative inside the package, sorted dart: / package: / relative.
    - prefer_relative_imports
    - directives_ordering
    - sort_pub_dependencies

    # Async and lifecycle mistakes.
    - unawaited_futures
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
    - avoid_void_async

    # Types and style.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
