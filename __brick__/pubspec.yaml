name: {{project_name.snakeCase()}}
description: "{{description}}"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  firebase_core: ^4.2.0
  firebase_app_check: ^0.4.1+1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  flutter_modular: ^6.4.1
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  internet_connection_checker_plus: ^2.9.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.7
  json_annotation: ^4.9.0
  bloc: ^9.1.0
  dartz: ^0.10.1
  google_nav_bar: ^5.0.7
  loading_animation_widget: ^1.3.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  flutter_social_button: ^1.1.6+1
  image_picker: ^1.1.2
  firebase_storage: ^13.0.4
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.0
  json_serializable: ^6.11.1

flutter:
