name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Mason
        run: dart pub global activate mason_cli

      - name: Generate a project from the brick
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          mkdir -p "$RUNNER_TEMP/gen" && cd "$RUNNER_TEMP/gen"
          mason init
          mason add flutter_template --path "$GITHUB_WORKSPACE"
          mason make flutter_template --on-conflict overwrite -o out \
            --project_name demo_app \
            --description "A demo app" \
            --org_name com.example \
            --use_firebase true --use_camera true --use_photo_library true

      - name: Test with coverage
        working-directory: ${{ runner.temp }}/gen/out
        run: flutter test --coverage

      - name: Summarize coverage
        working-directory: ${{ runner.temp }}/gen/out
        run: |
          awk -F: '/^LF:/{t+=$2} /^LH:/{h+=$2} END{printf "Line coverage: %.1f%% (%d/%d)\n", h*100/t, h, t}' \
            coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/gen/out/coverage/lcov.info
